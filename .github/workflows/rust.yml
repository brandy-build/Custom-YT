name: Build & Release Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: custom_yt-linux-amd64.tar.gz
            asset_path: custom_yt-linux-amd64.tar.gz
          - os: windows-latest
            artifact_name: custom_yt-windows-amd64.zip
            asset_path: custom_yt-windows-amd64.zip
          - os: macos-latest
            artifact_name: custom_yt-macos-universal.tar.gz
            asset_path: custom_yt-macos-universal.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/release
          BIN_NAME=$(find . -maxdepth 1 -type f -executable ! -name "*.d" ! -name "*.so" ! -name "*.dylib" | head -n 1 | sed 's|./||')
          tar -czvf "../../${{ matrix.artifact_name }}" "$BIN_NAME"
          cd ../..

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/custom_yt.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Generate SLSA Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '${{ matrix.asset_path }}'

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}