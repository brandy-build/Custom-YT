name: Build & Release Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build Linux Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        run: |
          # Finds whichever binary cargo generated in target/release/ and packages it
          cd target/release
          BIN_NAME=$(find . -maxdepth 1 -type f -executable ! -name "*.d" ! -name "*.so" | head -n 1 | sed 's|./||')
          strip "$BIN_NAME"
          tar -czvf "../../custom_yt-linux-amd64.tar.gz" "$BIN_NAME"
          cd ../..

      - name: Generate SLSA Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'custom_yt-linux-amd64.tar.gz'

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_yt-linux-amd64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
