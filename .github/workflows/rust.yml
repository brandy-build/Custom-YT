name: Rust CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Job 1: Compilation Check (Runs on every Push / PR)
  # ------------------------------------------------------------------
  check:
    name: Check Code Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Cargo Build Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --all-targets

  # ------------------------------------------------------------------
  # Job 2: Build Cross-Platform Release Binaries (Runs on Version Tags)
  # ------------------------------------------------------------------
  build-release:
    name: Release Build (${{ matrix.target }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: custom-yt.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: custom-yt
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: custom-yt

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-yt-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}